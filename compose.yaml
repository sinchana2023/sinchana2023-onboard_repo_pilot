services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
    environment:
      DATABASE_URL: postgresql+psycopg://onboardai:onboardai@db:5432/onboardai
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: onboardai
      POSTGRES_PASSWORD: onboardai
      POSTGRES_DB: onboardai
    ports:
      - "5432:5432"
    volumes:
      - onboardai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardai -d onboardai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onboardai_postgres_data: